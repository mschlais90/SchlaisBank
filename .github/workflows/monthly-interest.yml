name: Post monthly interest

# Backstop for the 1%-per-month interest, replacing the Vercel cron.
# The app also catches up whenever someone opens it, so this only matters if
# nobody visits for a while.
#
# Two GitHub quirks worth knowing: scheduled runs can lag the requested time by
# a few minutes to an hour, and GitHub disables schedules on repos with no
# activity for 60 days. Neither can post interest twice — the database has a
# unique index on one interest row per kid per month.
on:
  schedule:
    - cron: "0 8 1 * *" # 08:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  post-interest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the interest endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not set (e.g. https://schlaisbank.onrender.com)."
            exit 1
          fi

          # --retry rides out the cold start on Render's free plan, where the
          # first request after a quiet spell wakes the service and can take ~1 min.
          response=$(curl --fail-with-body -sS \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            "${APP_URL%/}/api/cron/interest")

          echo "$response"
          echo "::notice::Interest run complete: $response"
