name: Deploy to Render

# Every push to main deploys that exact commit to the Render service, then waits
# for the deploy to finish so a red X here means a broken deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight watcher; Render itself queues the deploys.
concurrency:
  group: render-deploy
  cancel-in-progress: true

# Defaults to the current service, but a RENDER_SERVICE_ID repository variable
# (Settings → Secrets and variables → Actions → Variables) overrides it, so
# recreating the service doesn't have to mean editing this file.
env:
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || 'srv-da0br0ugekts739i87lg' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          if [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::RENDER_SERVICE_ID variable is not set. Add it under Settings → Secrets and variables → Actions → Variables (value looks like srv-xxxxxxxxxxxx)."
            exit 1
          fi

          # Keep the body and HTTP code together — an empty body with no status
          # code told us nothing the last time this failed.
          response=$(curl -sS -w $'\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg sha "${GITHUB_SHA}" '{clearCache:"do_not_clear",commitId:$sha}')" 2>&1)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          case "$code" in
            200 | 201 | 202) ;;
            401 | 403)
              echo "::error::Render rejected the API key (HTTP $code). Regenerate it and update the RENDER_API_KEY secret. Response: $body"
              exit 1 ;;
            404)
              echo "::error::Render has no service '${RENDER_SERVICE_ID}' (HTTP 404). Check the RENDER_SERVICE_ID variable. Response: $body"
              exit 1 ;;
            *)
              echo "::error::Render returned HTTP $code when starting the deploy. Response: $body"
              exit 1 ;;
          esac

          deploy_id=$(echo "$body" | jq -r '.id // empty' 2>/dev/null)

          # Render answers 202 with an empty body when it folds our request into a
          # deploy that's already running for this commit — which is what happens
          # while the service's own Auto-Deploy is on. The deploy is real, we just
          # weren't handed its id, so look it up by commit instead of failing.
          if [ -z "$deploy_id" ]; then
            echo "Render returned HTTP $code with no deploy id; looking up the deploy for ${GITHUB_SHA::7}."
            for _ in 1 2 3 4 5; do
              sleep 5
              list=$(curl -sS \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" \
                -H "Authorization: Bearer ${RENDER_API_KEY}")
              # List endpoints wrap each item as {"deploy": {...}}; tolerate both shapes.
              deploy_id=$(echo "$list" | jq -r --arg sha "$GITHUB_SHA" \
                'if type == "array"
                 then first(.[] | (.deploy // .) | select(.commit.id? == $sha) | .id) // empty
                 else empty end' 2>/dev/null)
              [ -n "$deploy_id" ] && break
            done
          fi

          if [ -z "$deploy_id" ]; then
            echo "::error::Render returned HTTP $code with no deploy id, and no deploy for commit ${GITHUB_SHA} appeared. Response: $body"
            exit 1
          fi

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Triggered deploy $deploy_id for commit ${GITHUB_SHA::7}"

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -uo pipefail

          dashboard="https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
          status=""
          consecutive_errors=0

          # 30s between polls, up to ~25 minutes. Render's free plan builds are slow.
          for _ in $(seq 1 50); do
            sleep 30

            # Capture body and HTTP code together so a bad response is reported
            # rather than silently killing the step.
            response=$(curl -sS -w $'\n%{http_code}' \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" 2>&1)
            code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$code" != "200" ]; then
              consecutive_errors=$((consecutive_errors + 1))
              echo "poll failed: HTTP $code — $body"
              # A blip in Render's API shouldn't fail a deploy that's still running.
              if [ "$consecutive_errors" -ge 3 ]; then
                echo "::error::Could not read deploy status (HTTP $code) three times running: $body"
                echo "::error::Deploy $DEPLOY_ID may still be running — check $dashboard"
                exit 1
              fi
              continue
            fi
            consecutive_errors=0

            status=$(echo "$body" | jq -r '.status // empty')
            if [ -z "$status" ]; then
              echo "::warning::No status field in response: $body"
              continue
            fi
            echo "status: $status"

            case "$status" in
              live)
                echo "::notice::Deploy $DEPLOY_ID is live."
                exit 0
                ;;
              build_failed | update_failed | pre_deploy_failed | canceled | deactivated)
                echo "::error::Deploy $DEPLOY_ID ended as '$status'. Build logs: $dashboard"
                exit 1
                ;;
            esac
          done

          echo "::error::Gave up waiting; deploy $DEPLOY_ID was still '$status' after 25 minutes. See $dashboard"
          exit 1

      # When a deploy fails, pull the service config and Render's build log into
      # this job's output, so debugging doesn't mean a trip to the dashboard.
      - name: Diagnose the failure
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -uo pipefail

          api() {
            curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" "$@"
          }

          # Job logs need repo-admin auth to read via the API, but ::error::
          # annotations are public. Mirror the diagnosis into one annotation so
          # it can be read from the commit's checks without downloading logs.
          annotate() {
            local encoded
            encoded=$(printf '%s' "$1" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${encoded}"
          }

          echo "===== Service configuration ====="
          service=$(api "https://api.render.com/v1/services/${RENDER_SERVICE_ID}")
          config=$(echo "$service" | jq -r '
            "type:          \(.type // "?")",
            "runtime:       \(.serviceDetails.runtime // .serviceDetails.env // "?")",
            "branch:        \(.branch // "?")",
            "rootDir:       \(if (.rootDir // "") == "" then "(repo root)" else .rootDir end)",
            "autoDeploy:    \(.autoDeploy // "?")   <- should be \"no\"; \"yes\" means every push deploys twice",
            "buildCommand:  \(.serviceDetails.envSpecificDetails.buildCommand // "(not set)")",
            "startCommand:  \(.serviceDetails.envSpecificDetails.startCommand // "(not set)")",
            "healthCheck:   \(.serviceDetails.healthCheckPath // "(none)")"
          ' 2>/dev/null) || config="could not parse service response: $service"
          echo "$config"
          annotate "Render service config:
          $config"

          echo ""
          echo "===== Build log (most recent 100 lines) ====="
          owner=$(echo "$service" | jq -r '.ownerId // empty')
          if [ -z "$owner" ]; then
            echo "No ownerId on the service response; skipping log fetch."
            echo "Build logs: https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
            exit 0
          fi

          logs=$(api -G "https://api.render.com/v1/logs" \
            --data-urlencode "ownerId=${owner}" \
            --data-urlencode "resource=${RENDER_SERVICE_ID}" \
            --data-urlencode "type=build" \
            --data-urlencode "direction=backward" \
            --data-urlencode "limit=100")

          # The API returns newest-first; reverse so the log reads top to bottom.
          build_log=$(echo "$logs" | jq -r '[.logs[]? | "\(.timestamp)  \(.message)"] | reverse | .[]' 2>/dev/null) \
            || build_log="could not parse log response: $logs"
          echo "$build_log"

          # Annotations get truncated, so only the tail goes in the annotation.
          annotate "Render build log (last 30 lines):
          $(echo "$build_log" | tail -n 30)"

          echo ""
          echo "Full logs: https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
